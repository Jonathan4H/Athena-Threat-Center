<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athena Threat Center - Login</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/login-page.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/bootstrap-icons.min.css') }}">
</head>
<body>
    <div class="login-box">
        <h2>Athena Threat Center</h2>
        <form>
            <div class="user-box">
                <input type="email" name="email" autocomplete="email" autofocus required>
                <label>Email</label>
            </div>
            <div class="user-box password-box">
                <input type="password" name="password" id="validator" required>
                <label>Password</label>
                <i class="bi bi-eye-slash" id="togglePassword"></i>
            </div>
            <div class="forget">
                <a href="reset-pass.html">Forgot Password?</a>
            </div>
            <a href="/" id="signin">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                Login
            </a>
            <div class="signup">
                <p>
                    New to Athena Threat Center?
                    <a href="signup-page.html">Create Account</a>
                </p>
            </div>
        </form>
    </div>
</body>
<script>
    const validator = document.getElementById("validator");
    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
        if (validator.type === "password") {
            validator.type = "text";
            togglePassword.classList.remove("bi-eye-slash");
            togglePassword.classList.add("bi-eye");
        } else {
            validator.type = "password";
            togglePassword.classList.remove("bi-eye");
            togglePassword.classList.add("bi-eye-slash");
        }
    });
</script>
</html>
