<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athena Threat Center - Sign Up</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/signup-page.css') }}">
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/bootstrap-icons.min.css') }}">
</head>
<body>
    <div class="signup-box">
        <h2>Athena Threat Center</h2>
        <form>
            <div class="user-box">
                <input type="text" name="username" required>
                <label>Username</label>
            </div>
            <div class="user-box">
                <input type="email" name="email" required>
                <label>Email</label>
            </div>
            <div class="user-box password-box">
                <input type="password" name="password" id="validator" required>
                <label>Password</label>
                <i class="bi bi-eye-slash" id="togglePassword"></i>
            </div>
            <div class="password-actions">
                <button type="button" id="generatePassword">
                    <i class="bi bi-shuffle"></i> Generate Password
                </button>
            </div>
            <div class="password-check">
                <div class="check-length">
                    <i class="bi bi-x-circle"></i> At least 8 characters long
                </div>
                <div class="check-number">
                    <i class="bi bi-x-circle"></i> At least 1 number (0-9)
                </div>
                <div class="check-special">
                    <i class="bi bi-x-circle"></i> At least 1 special character (@-$)
                </div>
            </div>
            <a href="login-page.html">Create Account</a>
        </form>
    </div>
</body>
<script>
    const validator = document.getElementById("validator");
    const passwordCheck = document.querySelectorAll(".password-check i");
    validator.focus();
    const combinations = [
        { regex: /.{8}/, key: 0 },
        { regex: /[0-9]/, key: 1 },
        { regex: /[^A-Za-z0-9]/, key: 2 }
    ];
    function updateValidation() {
        combinations.forEach((item) => {
            const isValid = item.regex.test(validator.value);
            const checkItem = passwordCheck[item.key];

            checkItem.classList.toggle("bi-check-circle", isValid);
            checkItem.classList.toggle("bi-x-circle", !isValid);

            checkItem.parentElement.classList.toggle("valid", isValid);
            checkItem.parentElement.classList.toggle("invalid", !isValid);
        });
    }

    // Update as the user types
    validator.addEventListener("input", updateValidation);

    // Initialize the validation state on page load
    updateValidation();
    const generateBtn = document.getElementById("generatePassword");

    generateBtn.addEventListener("click", () => {
        validator.value = generatePassword(16);

        // Trigger validation
        validator.dispatchEvent(new Event("keyup"));
        updateValidation();
    });

    function generatePassword(length = 16) {
        const uppercase = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const lowercase = "abcdefghijklmnopqrstuvwxyz";
        const numbers = "0123456789";
        const specials = "!@#$%^&*()-_=+[]{}<>?";

        const allChars = uppercase + lowercase + numbers + specials;

        let password = "";

        // Guarantee at least one of each required type
        password += secureRandomChar(uppercase);
        password += secureRandomChar(lowercase);
        password += secureRandomChar(numbers);
        password += secureRandomChar(specials);

        // Fill the remaining characters
        for (let i = password.length; i < length; i++) {
            password += secureRandomChar(allChars);
        }

        // Shuffle the password
        password = shuffle(password);

        return password;
    }

    function secureRandomChar(chars) {
        const array = new Uint32Array(1);
        crypto.getRandomValues(array);
        return chars[array[0] % chars.length];
    }

    function secureRandomInt(max) {
        if (!Number.isInteger(max) || max <= 0) {
            throw new Error("max must be a positive integer.");
        }

        const array = new Uint32Array(1);
        const limit = Math.floor(0x100000000 / max) * max;

        let random;

        // Rejection sampling to avoid modulo bias.
        do {
            crypto.getRandomValues(array);
            random = array[0];
        } while (random >= limit);

        return random % max;
    }

    function shuffle(str) {
        const arr = [...str];

        for (let i = arr.length - 1; i > 0; i--) {
            const j = secureRandomInt(i + 1);
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }

        return arr.join("");
    }

    const togglePassword = document.getElementById("togglePassword");

    togglePassword.addEventListener("click", () => {
        if (validator.type === "password") {
            validator.type = "text";
            togglePassword.classList.remove("bi-eye-slash");
            togglePassword.classList.add("bi-eye");
        } else {
            validator.type = "password";
            togglePassword.classList.remove("bi-eye");
            togglePassword.classList.add("bi-eye-slash");
        }
    });
</script>
</html>
